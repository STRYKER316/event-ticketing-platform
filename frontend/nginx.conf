server {
    listen 80;

    # Built assets live under /usr/share/nginx/html/app (Dockerfile), matching
    # the /app URI prefix Traefik routes here (decisions-log §23 amendment) —
    # root + location prefix line up so $uri resolves directly to disk.
    location /app/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /app/index.html;
    }
}
