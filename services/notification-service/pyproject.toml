[project]
name = "notification-service"
version = "0.1.0"
description = "Notification service — no DB; Kafka #3 consumer with hand-rolled retry/backoff/DLQ"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "structlog>=24.4",
    "prometheus-fastapi-instrumentator>=7.0",
    "pydantic-settings>=2.5",
    "aiokafka>=0.12",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.27",
    "testcontainers[kafka]>=4.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
