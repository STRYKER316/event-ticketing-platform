[project]
name = "shared-auth"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "STRYKER316", email = "ansil.mishra316@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic-settings>=2.5",
    "pyjwt[crypto]>=2.9",
]

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
