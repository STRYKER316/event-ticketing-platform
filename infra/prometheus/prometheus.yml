global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: event-service
    metrics_path: /metrics
    static_configs:
      - targets: ["event-service:8001"]

  - job_name: search-service
    metrics_path: /metrics
    static_configs:
      - targets: ["search-service:8002"]

  - job_name: booking-service
    metrics_path: /metrics
    static_configs:
      - targets: ["booking-service:8003"]

  - job_name: payment-service
    metrics_path: /metrics
    static_configs:
      - targets: ["payment-service:8004"]
