[project]
name = "kafka-smoke-test"
version = "0.1.0"
description = "Throwaway aiokafka producer/consumer round-trip — proves the compose Kafka broker works before any service depends on it (§7)"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.11",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
