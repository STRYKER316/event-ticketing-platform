name: event-ticketing-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      EVENT_DB_NAME: ${EVENT_DB_NAME}
      EVENT_DB_USER: ${EVENT_DB_USER}
      EVENT_DB_PASSWORD: ${EVENT_DB_PASSWORD}
      BOOKING_DB_NAME: ${BOOKING_DB_NAME}
      BOOKING_DB_USER: ${BOOKING_DB_USER}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD}
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME}
      PAYMENT_DB_USER: ${PAYMENT_DB_USER}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_PORT}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Without this, the image's KRaft-mode default log dir doesn't match
      # the kafka_data volume mount below, so the volume silently persists
      # nothing and a container recreate wipes every topic and committed offset.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_PORT}:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    # entrypoint.sh renders realm-export.json from its template (substituting
    # APP_ORIGIN into the placeholder redirectUris/webOrigins) before handing
    # off to the image's own start-dev --import-realm entrypoint -- see the
    # script for why.
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      APP_ORIGIN: ${APP_ORIGIN}
    ports:
      - "${KEYCLOAK_PORT}:8080"
    volumes:
      # Mounted outside /opt/keycloak/data/import on purpose: Docker
      # auto-creates a bind mount's parent directory as root:root, and the
      # image's non-root `keycloak` user (uid 1000) can't write into it --
      # entrypoint.sh creates /opt/keycloak/data/import itself instead
      # (writable, since /opt/keycloak/data is group-writable by root/gid 0,
      # which uid 1000 belongs to) and renders the realm file there.
      - ./keycloak/realm-export.json.template:/tmp/realm-export.json.template:ro
      - ./keycloak/entrypoint.sh:/entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  event-service:
    build:
      context: ../services
      dockerfile: event-service/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      EVENT_DB_NAME: ${EVENT_DB_NAME}
      EVENT_DB_USER: ${EVENT_DB_USER}
      EVENT_DB_PASSWORD: ${EVENT_DB_PASSWORD}
      EVENT_SERVICE_PORT: 8001
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_EVENT_DB_NAME: event_service
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EVENTS_TOPIC: event.events
      # Must match the `iss` claim Keycloak actually stamps on tokens, which
      # it derives from whatever host the browser used to reach it -- not
      # the Docker-internal `keycloak` hostname used below for JWKS fetches.
      AUTH_KEYCLOAK_ISSUER: ${APP_ORIGIN}:${KEYCLOAK_PORT}/realms/${KEYCLOAK_REALM}
      AUTH_EXPECTED_AUDIENCE: ticketing-services
      AUTH_JWKS_URI_OVERRIDE: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      # No curl/wget on python:slim -- urllib avoids adding a package just for this.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      traefik.enable: "true"
      traefik.http.routers.event-service.rule: PathPrefix(`/`)
      traefik.http.services.event-service.loadbalancer.server.port: "8001"

  search-service:
    build:
      context: ../services
      dockerfile: search-service/Dockerfile
    environment:
      SEARCH_SERVICE_PORT: 8002
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EVENTS_TOPIC: event.events
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/healthz', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      traefik.enable: "true"
      # Longer, more specific rules take priority over event-service's
      # catch-all PathPrefix(`/`) by default in Traefik v3 (priority scales
      # with rule length) — no explicit priority needed.
      traefik.http.routers.search-service.rule: PathPrefix(`/search`)
      traefik.http.services.search-service.loadbalancer.server.port: "8002"

  booking-service:
    build:
      context: ../services
      dockerfile: booking-service/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      BOOKING_DB_NAME: ${BOOKING_DB_NAME}
      BOOKING_DB_USER: ${BOOKING_DB_USER}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD}
      BOOKING_SERVICE_PORT: 8003
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EVENTS_TOPIC: event.events
      PAYMENT_OUTCOMES_TOPIC: payment.outcomes
      CANCELLED_BOOKINGS_TOPIC: booking.cancelled
      NOTIFICATIONS_TOPIC: notifications
      HOLD_STRATEGY: cron
      PAYMENT_SERVICE_URL: http://payment-service:8004
      AUTH_KEYCLOAK_ISSUER: ${APP_ORIGIN}:${KEYCLOAK_PORT}/realms/${KEYCLOAK_REALM}
      AUTH_EXPECTED_AUDIENCE: ticketing-services
      AUTH_JWKS_URI_OVERRIDE: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/healthz', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      traefik.enable: "true"
      # Same reasoning as search-service's rule above — more specific than
      # event-service's catch-all PathPrefix(`/`), no explicit priority needed.
      traefik.http.routers.booking-service.rule: PathPrefix(`/bookings`)
      traefik.http.services.booking-service.loadbalancer.server.port: "8003"

  payment-service:
    build:
      context: ../services
      dockerfile: payment-service/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME}
      PAYMENT_DB_USER: ${PAYMENT_DB_USER}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      PAYMENT_SERVICE_PORT: 8004
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PAYMENT_OUTCOMES_TOPIC: payment.outcomes
      CANCELLED_BOOKINGS_TOPIC: booking.cancelled
      NOTIFICATIONS_TOPIC: notifications
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      AUTH_KEYCLOAK_ISSUER: ${APP_ORIGIN}:${KEYCLOAK_PORT}/realms/${KEYCLOAK_REALM}
      AUTH_EXPECTED_AUDIENCE: ticketing-services
      AUTH_JWKS_URI_OVERRIDE: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/healthz', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      traefik.enable: "true"
      # Deliberately narrower than every other service's rule: only the
      # webhook is meant to be reachable from outside the Docker network.
      # /payments/charge is called exclusively by booking-service, over the
      # internal network directly (PAYMENT_SERVICE_URL), never through
      # Traefik — a PathPrefix(`/payments`) rule here would let any
      # authenticated end user call it directly with an arbitrary
      # booking_id/amount_cents, bypassing booking-service's ownership check
      # and authoritative price lookup entirely.
      traefik.http.routers.payment-service.rule: PathPrefix(`/payments/webhook`)
      traefik.http.services.payment-service.loadbalancer.server.port: "8004"

  notification-service:
    build:
      context: ../services
      dockerfile: notification-service/Dockerfile
    environment:
      NOTIFICATION_SERVICE_PORT: 8005
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NOTIFICATIONS_TOPIC: notifications
      NOTIFICATION_RETRY_TOPIC: notification-retry
      NOTIFICATION_DLQ_TOPIC: notification-dlq
      # 0 disabled — a demo/test instrument only, see decisions-log §17
      # amendment (2026-08-18). Override on the CLI for a live walkthrough,
      # never left non-zero in this baseline compose file.
      SIMULATED_FAILURE_ATTEMPTS: 0
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/healthz', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      traefik.enable: "true"
      # Same PathPrefix convention every non-root service follows, kept for
      # consistency even though nothing calls this service externally —
      # /healthz is reachable only directly against the container, not
      # through this router: PathPrefix doesn't strip itself, so
      # /notifications/healthz 404s the same way every other service's own
      # prefix does (live-verified P5.T1, see docs/phases/phase-5-kickoff.md).
      traefik.http.routers.notification-service.rule: PathPrefix(`/notifications`)
      traefik.http.services.notification-service.loadbalancer.server.port: "8005"

  frontend:
    build:
      context: ../frontend
      args:
        # Vite bakes these into the bundle at build time (frontend/Dockerfile).
        # Empty (relative/same-origin) rather than an absolute host: Traefik
        # serves the frontend and proxies every backend API from the same
        # origin/port, so a relative fetch always resolves correctly whether
        # that origin is localhost or the EB public address -- no rebuild
        # needed per environment. Only Keycloak is genuinely
        # environment-specific (its own port, not proxied through Traefik at
        # all -- see the keycloak service above), so its issuer is resolved
        # at runtime from window.location instead of baked here; see
        # frontend/src/auth/oidcConfig.ts. VITE_KEYCLOAK_PORT/_REALM are
        # baked because they're the same across environments, unlike the host.
        VITE_EVENT_SERVICE_URL: ""
        VITE_SEARCH_SERVICE_URL: ""
        VITE_BOOKING_SERVICE_URL: ""
        VITE_KEYCLOAK_PORT: ${KEYCLOAK_PORT}
        VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM}
    labels:
      traefik.enable: "true"
      # event-service keeps its locked PathPrefix('/') catch-all as-is
      # (CLAUDE.md — "left as-is on purpose rather than retrofitted"), so
      # the frontend gets its own specific prefix like every other
      # post-event-service addition, not a competing catch-all
      # (decisions-log §23 amendment).
      traefik.http.routers.frontend.rule: PathPrefix(`/app`)
      traefik.http.services.frontend.loadbalancer.server.port: "80"

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["benchmark"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["benchmark"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    depends_on:
      prometheus:
        condition: service_healthy

  docker-socket-proxy:
    image: nginx:1.27-alpine
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker-socket-proxy/nginx.conf:/etc/nginx/nginx.conf:ro

  traefik:
    image: traefik:v3.5
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://docker-socket-proxy:2375"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "${TRAEFIK_DASHBOARD_PORT}:8080"
    depends_on:
      - docker-socket-proxy

volumes:
  postgres_data:
  mongo_data:
  es_data:
  kafka_data:
  prometheus_data:
  grafana_data:
