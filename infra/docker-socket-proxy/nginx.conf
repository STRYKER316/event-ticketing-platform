# Strips any /vX.Y/ API-version prefix before forwarding to the Docker socket.
#
# Workaround for a local Docker Desktop build whose daemon enforces
# MinAPIVersion 1.40 even for the unversioned negotiation handshake — Traefik's
# embedded Docker client hardcodes an initial /v1.24/version probe, which this
# daemon flatly rejects with 400 before negotiation can ever step up. The
# unversioned endpoint (no prefix) always succeeds against this daemon, so
# every request gets normalized to it here.
user root;
events {}

http {
  upstream docker {
    server unix:/var/run/docker.sock;
  }

  server {
    listen 2375;
    rewrite ^/v[0-9]+\.[0-9]+/(.*)$ /$1 break;

    location / {
      proxy_pass http://docker;
      proxy_http_version 1.1;
      proxy_buffering off;
    }
  }
}
